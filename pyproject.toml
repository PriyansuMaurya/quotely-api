[project]
name = "quotely-api"
version = "1.0.0"
description = "A production-ready FastAPI service for random, filtered and paginated motivational quotes, backed by the Quotely library."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Maurya" }]
keywords = ["fastapi", "quotes", "quotely", "api", "render"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "quotely==1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    # Starlette's TestClient deprecates httpx in favour of httpx2.
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
