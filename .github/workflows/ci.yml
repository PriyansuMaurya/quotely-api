name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact release: setup-uv stopped publishing a floating
        # major tag, so "@v10" does not resolve and fails the job at setup.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Run the test suite
        run: uv run pytest

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type and accessibility check
        run: npm run check

      - name: Run component tests
        run: npm test
