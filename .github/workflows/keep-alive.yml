name: Keep-alive

# Render's free tier stops the service after 15 idle minutes, so the first
# request after a lull pays a ~50s cold start (and the browser sees a failure
# long before that). A scheduled ping keeps the process resident.
#
# Caveat worth knowing: GitHub's scheduler is best-effort and can run late
# under load, and it disables `schedule` triggers on public repositories after
# 60 days without repository activity. If the API must never cold-start, an
# external monitor on a fixed interval is the reliable option.

on:
  schedule:
    # 10 minutes rather than 15 so a late run still lands inside the idle window.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# The job only makes an outbound request; it needs nothing from the repository.
permissions: {}

concurrency:
  group: keep-alive
  # A cold start can take most of a minute, so never cancel a run in flight.
  cancel-in-progress: false

jobs:
  ping:
    name: Ping the API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the service and confirm it is healthy
        env:
          # Override with a repository variable to point this at a fork.
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://quotely-api-mvyq.onrender.com' }}
        run: |
          set -euo pipefail

          url="${API_BASE_URL%/}/health"
          echo "Pinging $url"

          # --retry-all-errors covers the 502/503 a waking container returns, and
          # the 90s ceiling covers Render's cold-start time before giving up.
          body=$(curl --silent --show-error --fail-with-body \
            --max-time 90 --retry 3 --retry-delay 5 --retry-all-errors \
            "$url")

          echo "$body"

          # A 200 whose body says anything but "ok" is still a broken service,
          # so the status is checked rather than the HTTP code alone.
          python3 - "$body" <<'PY'
          import json, sys

          health = json.loads(sys.argv[1])
          print(
              f"status={health['status']} uptime={health['uptime_seconds']}s "
              f"quotes={health['catalog_size']}"
          )
          sys.exit(0 if health["status"] == "ok" else 1)
          PY

          echo "Service is awake and healthy."
